name: "Rename Hotfix"

on:
  create:
    branches:
      - hotfix/*

jobs:
  rename-hotfix:
    runs-on: ubuntu-latest

    steps:
      - name: Create hotfix name
        uses: actions/github-script@v8
        id: hotfixName
        with:
          result-encoding: string
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const current = release.tag_name
            const match = current.match(/-hotfix-(\d+)$/);

            if (match) {
              const fixIndex = Number(match[1]);
              return current.replace(/-hotfix-\d+$/, `-hotfix-${fixIndex + 1}`);
            }

            return current + "-hotfix-1"

      - name: Get result
        run: echo "${{steps.hotfixName.outputs.result}}"
