name: "Rename Hotfix"

on:
  create:

jobs:
  rename-hotfix:
    runs-on: ubuntu-latest
    # on: create does not support branch filters the same way other events do
    # This workaround checks for a `hotfix/` prefix
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'hotfix/')

    steps:
      - name: Create hotfix name
        uses: actions/github-script@v8
        id: hotfixName
        with:
          result-encoding: string
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const current = release.tag_name
            const existingHotfix = current.match(/-hotfix-(\d+)$/);

            if (existingHotfix) {
              const fixIndex = Number(match[1]);
              return current.replace(/-hotfix-\d+$/, `-hotfix-${fixIndex + 1}`);
            }

            return current + "-hotfix-1"

      - name: Check out project
        uses: actions/checkout@v4

      - name: Commit hotfix name
        run: |
          HOTFIX_NAME="${{ steps.hotfixName.outputs.result }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git commit --allow-empty \
            -m "chore: hotfix ${HOTFIX_NAME}" \
            -m "Release-As: ${HOTFIX_NAME}"

          git push
